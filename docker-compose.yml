services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: public_bid_search_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_bid_search_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: public_bid_search_development
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
    volumes:
      - ./scraper:/app
    environment:
      PYTHONUNBUFFERED: "1"
    command: python main.py
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: